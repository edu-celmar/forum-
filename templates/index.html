
{% extends "base.html" %}

{% block content %}

<h2>Välkommen {{ session["username"] }}!</h2>

<h3>Skriv ett nytt inlägg</h3>

<form method="POST">
    <textarea name="text" placeholder="Skriv något..." required></textarea>
    <button type="submit">Publicera</button>
</form>

<h2>Alla inlägg</h2>

{% for post in posts %}

    <div class="post">
        <p>{{ post["text"] }}</p>
        <small>Skrivet av: <b>{{ post["name"] }}</b></small>
    </div>

{% else %}

    <p>Det finns inga inlägg ännu.</p>

{% endfor %}

{% endblock %}
